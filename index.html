<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A persistent task tracker built with vanilla JavaScript, HTML, and CSS.">
    <title>Tiny Task Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <section class="task-card" aria-labelledby="appTitle">
            <header class="app-header">
                <p class="eyebrow">Vanilla JavaScript Project</p>
                <h1 id="appTitle">Tiny Task Tracker</h1>
                <p class="subtitle">Keep track of what matters, one task at a time.</p>
            </header>

            <form id="taskForm" class="task-form">
                <label class="sr-only" for="taskInput">New task</label>
                <input
                    type="text"
                    id="taskInput"
                    name="task"
                    placeholder="What needs to get done?"
                    autocomplete="off"
                    maxlength="120"
                    required
                >
                <button id="addTaskButton" class="primary-button" type="submit">Add Task</button>
            </form>

            <div class="task-toolbar">
                <div class="filters" aria-label="Filter tasks">
                    <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">All</button>
                    <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
                    <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
                </div>
                <p id="taskCount" class="task-count" aria-live="polite"></p>
            </div>

            <ul id="taskList" class="task-list" aria-label="Tasks"></ul>
            <p id="emptyState" class="empty-state">No tasks yet. Add one above.</p>
            <p id="statusMessage" class="sr-only" aria-live="polite"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
