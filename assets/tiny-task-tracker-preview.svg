<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Tiny Task Tracker preview</title>
  <desc id="desc">Dark themed task tracker with filters, task completion, edit, and delete controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d3f"/>
      <stop offset="0.48" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#09263a"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="190" y="62" width="820" height="636" rx="28" fill="#0f172a" fill-opacity="0.92" stroke="#334155" stroke-opacity="0.7" filter="url(#shadow)"/>

  <text x="240" y="118" fill="#a5b4fc" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">VANILLA JAVASCRIPT PROJECT</text>
  <text x="240" y="164" fill="#f8fafc" font-family="Arial, sans-serif" font-size="40" font-weight="700">Tiny Task Tracker</text>
  <text x="240" y="197" fill="#aeb9ce" font-family="Arial, sans-serif" font-size="18">Keep track of what matters, one task at a time.</text>

  <rect x="240" y="232" width="510" height="54" rx="14" fill="#111a31" stroke="#475569"/>
  <text x="260" y="266" fill="#7d8aa3" font-family="Arial, sans-serif" font-size="17">What needs to get done?</text>
  <rect x="764" y="232" width="196" height="54" rx="14" fill="url(#primary)"/>
  <text x="862" y="266" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Add Task</text>

  <rect x="240" y="318" width="68" height="36" rx="10" fill="#4f46e5"/>
  <text x="274" y="341" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">All</text>
  <rect x="318" y="318" width="80" height="36" rx="10" fill="#1e293b"/>
  <text x="358" y="341" text-anchor="middle" fill="#9aa7bd" font-family="Arial, sans-serif" font-size="14" font-weight="700">Active</text>
  <rect x="408" y="318" width="108" height="36" rx="10" fill="#1e293b"/>
  <text x="462" y="341" text-anchor="middle" fill="#9aa7bd" font-family="Arial, sans-serif" font-size="14" font-weight="700">Completed</text>
  <text x="960" y="341" text-anchor="end" fill="#8f9cb1" font-family="Arial, sans-serif" font-size="15">2 tasks left</text>

  <g transform="translate(240 378)">
    <rect width="720" height="82" rx="16" fill="#1e293b" fill-opacity="0.68" stroke="#475569" stroke-opacity="0.55"/>
    <rect x="20" y="31" width="20" height="20" rx="4" fill="none" stroke="#818cf8" stroke-width="2"/>
    <text x="58" y="50" fill="#e9eef8" font-family="Arial, sans-serif" font-size="18">Prepare for HackRice</text>
    <rect x="528" y="23" width="74" height="36" rx="10" fill="#6366f1" fill-opacity="0.18"/>
    <text x="565" y="46" text-anchor="middle" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="14" font-weight="700">Edit</text>
    <rect x="614" y="23" width="86" height="36" rx="10" fill="#ef4444" fill-opacity="0.14"/>
    <text x="657" y="46" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="14" font-weight="700">Delete</text>
  </g>

  <g transform="translate(240 474)" opacity="0.72">
    <rect width="720" height="82" rx="16" fill="#1e293b" fill-opacity="0.68" stroke="#475569" stroke-opacity="0.55"/>
    <rect x="20" y="31" width="20" height="20" rx="4" fill="#6366f1"/>
    <path d="M25 41 l4 4 l7 -9" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="50" fill="#8794aa" font-family="Arial, sans-serif" font-size="18" text-decoration="line-through">Finish JavaScript fundamentals</text>
    <rect x="528" y="23" width="74" height="36" rx="10" fill="#6366f1" fill-opacity="0.18"/>
    <text x="565" y="46" text-anchor="middle" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="14" font-weight="700">Edit</text>
    <rect x="614" y="23" width="86" height="36" rx="10" fill="#ef4444" fill-opacity="0.14"/>
    <text x="657" y="46" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="14" font-weight="700">Delete</text>
  </g>

  <g transform="translate(240 570)">
    <rect width="720" height="82" rx="16" fill="#1e293b" fill-opacity="0.68" stroke="#475569" stroke-opacity="0.55"/>
    <rect x="20" y="31" width="20" height="20" rx="4" fill="none" stroke="#818cf8" stroke-width="2"/>
    <text x="58" y="50" fill="#e9eef8" font-family="Arial, sans-serif" font-size="18">Start learning React</text>
    <rect x="528" y="23" width="74" height="36" rx="10" fill="#6366f1" fill-opacity="0.18"/>
    <text x="565" y="46" text-anchor="middle" fill="#c7d2fe" font-family="Arial, sans-serif" font-size="14" font-weight="700">Edit</text>
    <rect x="614" y="23" width="86" height="36" rx="10" fill="#ef4444" fill-opacity="0.14"/>
    <text x="657" y="46" text-anchor="middle" fill="#fecaca" font-family="Arial, sans-serif" font-size="14" font-weight="700">Delete</text>
  </g>
</svg>
